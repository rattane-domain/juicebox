
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Juicebox</title>
      <!-- Favicons: ICO/PNG first (Safari fallback), then SVG for modern browsers -->
      <link rel="icon" href="/favicon2.ico" sizes="any" />
      <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
      <link rel="manifest" href="/manifest.json" />
      <!-- Preload MediaSession artwork so iOS has it cached before Lock Screen renders -->
      <link rel="preload" as="image" href="/artwork.png" />
      <!-- Social Sharing (Open Graph) -->
      <meta property="og:title" content="Juicebox Radio" />
      <meta property="og:description" content="A 3D drink carousel radio app" />
      <meta property="og:image" content="/social-sharing.png" />
      <meta property="og:type" content="website" />
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:image" content="/social-sharing.png" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
